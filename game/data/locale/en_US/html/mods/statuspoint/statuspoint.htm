<html><title>Status Points</title><body>
<center>

<font color=LEVEL><b>Status Points</b></font>
<img src=L2UI.SquareGray width=296 height=1>

<table width=270 cellpadding=2 cellspacing=2>
<tr>
    <td width=80><font color=A3A3A3>STR</font></td>
    <td align=center>%str_display%</td>
    <td align=center width=60>%str_buttons%</td>
</tr>
<tr>
    <td width=80><font color=A3A3A3>CON</font></td>
    <td align=center>%con_display%</td>
    <td align=center width=60>%con_buttons%</td>
</tr>
<tr>
    <td width=80><font color=A3A3A3>DEX</font></td>
    <td align=center>%dex_display%</td>
    <td align=center width=60>%dex_buttons%</td>
</tr>
<tr>
    <td width=80><font color=A3A3A3>INT</font></td>
    <td align=center>%int_display%</td>
    <td align=center width=60>%int_buttons%</td>
</tr>
<tr>
    <td width=80><font color=A3A3A3>WIT</font></td>
    <td align=center>%wit_display%</td>
    <td align=center width=60>%wit_buttons%</td>
</tr>
<tr>
    <td width=80><font color=A3A3A3>MEN</font></td>
    <td align=center>%men_display%</td>
    <td align=center width=60>%men_buttons%</td>
</tr>
</table>

<br>

<table width=200 cellpadding=0 cellspacing=0>
<tr>
    <td align=center><button value="Confirm" action="bypass -h voiced_statuspoint confirm" width=100 height=25 back=L2UI_CH3.Btn1_normalOn fore=L2UI_CH3.Btn1_normal %confirm_enabled%></td>
</tr>
<tr>
    <td align=center><button value="Reset" action="bypass -h voiced_statuspoint reset" width=100 height=25 back=L2UI_CH3.Btn1_normalOn fore=L2UI_CH3.Btn1_normal %reset_enabled%></td>
</tr>
</table>

<br>

<font color=B09B79>COST: %reset_cost%</font>

<br>

Available: <font color=B09B79>%available%</font> |
Distributed: <font color=B09B79>%distributed%</font>

</center>
</body></html>
