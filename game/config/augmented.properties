# =================================================================
#                       Augmentation Settings
# =================================================================
# Configuracoes de augmentation: trade, glow, skills.
# Migrado de players.properties para organizacao.
# IMPORTANTE: Este arquivo NAO deve ser substituido por merges do CORE.
# Documentar conflito em CLAUDE.md.

# --- Trade ---
# Permite que itens augmentados sejam trocados (trade, private store, mail, warehouse)
# Default: False (comportamento original L2 Interlude)
AllowAugmentedTrade = False

# --- Drop ---
# Permite que itens augmentados sejam dropados no chão
# Default: False (comportamento original L2 Interlude)
AllowAugmentedDrop = False

# --- Pet ---
# Permite dar itens augmentados ao pet
# Default: False (comportamento original L2 Interlude)
AllowAugmentedPetItem = False

# --- Glow Chances (por grade de Life Stone) ---
# Chance de o augment ganhar glow (0-100)
AugmentationNGGlowChance = 0
AugmentationMidGlowChance = 40
AugmentationHighGlowChance = 70
AugmentationTopGlowChance = 100

# --- Skill Chances (por grade de Life Stone) ---
# Chance de o augment ganhar skill (0-100)
AugmentationNGSkillChance = 15
AugmentationMidSkillChance = 30
AugmentationHighSkillChance = 45
AugmentationTopSkillChance = 60

# --- Base Stat Chance ---
# Chance de augment ganhar stat base (STR/CON/INT/MEN)
AugmentationBaseStatChance = 1
