name: lineternity-loginserver

services:
  # ============================================================
  # MariaDB Login - Banco de dados do LoginServer
  # Contém: l2jdb_login (accounts, gameservers, hwid)
  # ============================================================
  mariadb-login:
    container_name: lineternity-mariadb-login
    hostname: mariadb-login
    image: mariadb:10.11
    volumes:
      - mariadb_login_data:/var/lib/mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - lineternity

  # ============================================================
  # LoginServer - Independente
  # Conecta em: mariadb-login (l2jdb_login)
  # Porta: 2106
  # ============================================================
  loginserver:
    container_name: lineternity-loginserver
    hostname: loginserver
    image: lineternity-newrev:latest
    build:
      context: ../build/distribution
      dockerfile: docker/Dockerfile
    depends_on:
      mariadb-login:
        condition: service_healthy
    ports:
      - "${LOGIN_PORT:-2106}:2106"
    environment:
      L2_EMAIL: ${L2_EMAIL:-contato@jogatinando.com.br}
      DB_HOST: ${DB_HOST:-mariadb-login}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      LOGIN_DB: ${LOGIN_DB:-l2jdb_login}
      HOSTNAME: ${HOSTNAME:-localhost}
      LOGIN_PORT: ${LOGIN_PORT:-2106}
    volumes:
      - ./login/config:/lineternity/login/config
      - ../../logs:/lineternity/logs
    command: ["login"]
    restart: unless-stopped
    networks:
      lineternity:
        aliases:
          - loginserver

volumes:
  mariadb_login_data:

networks:
  lineternity:
    external: true
    name: lineternity-network
