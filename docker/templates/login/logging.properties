############################################################
#  	Global properties
############################################################

# To also add the FileHandler, use the following line instead.
handlers = java.util.logging.FileHandler,\
		java.util.logging.ConsoleHandler,\
		ext.mods.commons.logging.handler.ErrorLogHandler
           
chat.handlers = ext.mods.commons.logging.handler.ChatLogHandler
chat.useParentHandlers = false

gmaudit.handlers = ext.mods.commons.logging.handler.GMAuditLogHandler
gmaudit.useParentHandlers = false

item.handlers = ext.mods.commons.logging.handler.ItemLogHandler
item.useParentHandlers = false

# Default global logging level.
.level= CONFIG

############################################################
# Handler specific properties.
############################################################

# console
java.util.logging.ConsoleHandler.formatter = ext.mods.commons.logging.formatter.NoTimestampConsoleFormatter
java.util.logging.ConsoleHandler.level = FINEST

# default file output is in user's home directory.
java.util.logging.FileHandler.pattern = log/console/console_%g.txt
java.util.logging.FileHandler.limit = 1000000
java.util.logging.FileHandler.count = 5
java.util.logging.FileHandler.formatter = ext.mods.commons.logging.formatter.FileLogFormatter
java.util.logging.FileHandler.level = CONFIG

# log errors (exceptions)
ext.mods.commons.logging.handler.ErrorLogHandler.pattern = log/error/error_%g.txt
ext.mods.commons.logging.handler.ErrorLogHandler.limit = 1000000
ext.mods.commons.logging.handler.ErrorLogHandler.count = 5
ext.mods.commons.logging.handler.ErrorLogHandler.formatter = java.util.logging.SimpleFormatter
ext.mods.commons.logging.handler.ErrorLogHandler.filter = ext.mods.commons.logging.filter.ErrorFilter
ext.mods.commons.logging.handler.ErrorLogHandler.level = CONFIG

# log chats
ext.mods.commons.logging.handler.ChatLogHandler.pattern = log/chat/chat_%g.txt
ext.mods.commons.logging.handler.ChatLogHandler.limit = 1000000
ext.mods.commons.logging.handler.ChatLogHandler.count = 5
ext.mods.commons.logging.handler.ChatLogHandler.formatter = ext.mods.commons.logging.formatter.ChatLogFormatter
ext.mods.commons.logging.handler.ChatLogHandler.filter = ext.mods.commons.logging.filter.ChatFilter
ext.mods.commons.logging.handler.ChatLogHandler.append = true
ext.mods.commons.logging.handler.ChatLogHandler.level = INFO

# log GM Audit
ext.mods.commons.logging.handler.GMAuditLogHandler.pattern = log/gmaudit/gmaudit_%g.txt
ext.mods.commons.logging.handler.GMAuditLogHandler.limit = 1000000
ext.mods.commons.logging.handler.GMAuditLogHandler.count = 5
ext.mods.commons.logging.handler.GMAuditLogHandler.formatter = ext.mods.commons.logging.formatter.GMAuditFormatter
ext.mods.commons.logging.handler.GMAuditLogHandler.filter = ext.mods.commons.logging.filter.GMAuditFilter
ext.mods.commons.logging.handler.GMAuditLogHandler.append = true
ext.mods.commons.logging.handler.GMAuditLogHandler.level = INFO

# log items
ext.mods.commons.logging.handler.ItemLogHandler.pattern = log/item/item_%g.txt
ext.mods.commons.logging.handler.ItemLogHandler.limit = 1000000
ext.mods.commons.logging.handler.ItemLogHandler.count = 5
ext.mods.commons.logging.handler.ItemLogHandler.formatter = ext.mods.commons.logging.formatter.ItemLogFormatter
ext.mods.commons.logging.handler.ItemLogHandler.filter = ext.mods.commons.logging.filter.ItemFilter
ext.mods.commons.logging.handler.ItemLogHandler.append = true
ext.mods.commons.logging.handler.ItemLogHandler.level = INFO

############################################################
# Facility specific properties.
############################################################

ext.mods.gameserver.level = CONFIG
ext.mods.loginserver.level = CONFIG

# JvmOptimizer: console silencioso no boot (banner da equipe). Verbose: -Dbrproject.jvm.verbose=true
ext.mods.commons.util.JvmOptimizer.level = WARNING
ext.mods.commons.util.JvmOptimizer.useParentHandlers = false
