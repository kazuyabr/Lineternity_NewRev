# =================================================================
#                       Status Points
# =================================================================

StatusPointsEnabled={{StatusPointsEnabled}}
StatusPointActivationDate=2026-01-01

# Unified pool: total points per level
PointsPerLevel={{PointsPerLevel}}

# DEX/WIT hard caps (base + distributed cannot exceed)
MaxTotalDex=50
MaxTotalWit=40

# Mount pet move speed bonus (npcId:bonusPercent, comma-separated)
# When mounted, speed caps are bypassed entirely
MountMoveSpeedBonus=12526:10,12527:10,12528:10,12621:15

# Exponential cost: cost = min(2^distributed, CostCapValue)
# When at cap, CostCapItems are required per upgrade
CostCapValue={{CostCapValue}}
CostCapItems={{CostCapItems}}

# Direct stat max limits (hard cap per stat)
PDefPerPoint=1
MaxDirectPDef={{MaxDirectPDef}}
MaxDirectMDef={{MaxDirectMDef}}
MaxDirectHp={{MaxDirectHp}}
MaxDirectMp={{MaxDirectMp}}
MaxDirectCp={{MaxDirectCp}}
MaxDirectPAtk={{MaxDirectPAtk}}
MaxDirectMAtk={{MaxDirectMAtk}}
MaxDirectAccuracy={{MaxDirectAccuracy}}
MaxDirectEvasion={{MaxDirectEvasion}}
MaxDirectCrit={{MaxDirectCrit}}

# Speed caps (max values without mount)
# With mount, these caps are bypassed (mount has its own speed)
MaxAttackSpeedPoints={{MaxAttackSpeedPoints}}
MaxMagicAttackSpeedPoints={{MaxMagicAttackSpeedPoints}}
MaxMovementSpeedPoints={{MaxMovementSpeedPoints}}

# Reset cost: itemId:count,itemId:count...
ResetCostItems={{ResetCostItems}}
PremiumExemptFromResetCost={{PremiumExemptFromResetCost}}
