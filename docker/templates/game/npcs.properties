# ============================================================
#                        Wyvern Manager
# ============================================================

# Required minimum level of the Strider to allow NPC to transform it to wyvern
RequiredStriderLevel = 55

# Number of needed B-crystals
RequiredCrystalsNumber = 10

# ============================================================
#                           Misc
# ============================================================

# Allow all Players to teleport without any cost. (Works with LvlFreeTeleport config).
FreeTeleport = False

# To what level is teleportation free? (for PTS up to level 40).
LvlFreeTeleport = 40

# Announce to players the location of the Mammon NPCs during Seal Validation.
AnnounceMammonSpawn = True

# Set to False to prevent mobs from auto-aggro against players in peace zones. Default = True.
MobAggroInPeaceZone = False

# Show monster level and custom title format
ShowNpcLevel = True

# Title format for monsters when ShowNpcLevel = True.
ShowNpcTitleFormat = Lvl %level% %aggro% %title%

# Show clan && alliance crests on NPCs, default: False
ShowNpcCrest = True

# Show clan && alliance crests on summons, default: False
ShowSummonCrest = True

# Tolerancia de range maxima para monstros atacarem o player
MonsterMaxRange = 135

