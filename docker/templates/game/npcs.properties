# ============================================================
#                        Spawn manager
# ============================================================

# Spawnlist multiplier 1.5 means, 50% more mobs will be spawned, default: 1.
SpawnMultiplier = 1.5

# List of npc maker events to be spawned during server startup
SpawnEvents = extra_mob;18age;start_weapon

# ============================================================
#                        Champion mobs
# ============================================================

# Chance for a mob to became champion (in percent) - 0 to disable
ChampionFrequency = 0

# Min and max lvl allowed for a mob to be champion.
ChampionMinLevel = 20
ChampionMaxLevel = 70

# Hp multiplier.
ChampionHp = 2

# Hp Regen Multiplier
ChampionHpRegen = 1.

# Rate control XP.
ChampionRateXp = 1.

# Rate control SP.
ChampionRateSp = 1.

# Rate control XP if player premium.
PremiumChampionRateXp = 1.

# Rate control SP if player premium.
PremiumChampionRateSp = 1.

# Rewards multiplier.
ChampionRewards = 1

# Rewards multiplier if player premium.
PremiumChampionRewards = 1

# Adenas rewards multiplier.
ChampionAdenasRewards = 1

# Seal stones rewards multiplier.
ChampionSealStoneRewards = 1

# Adenas rewards multiplier if player premium.
PremiumChampionAdenasRewards = 1

# Seal stones rewards multiplier if player premium.
PremiumChampionSealStoneRewards = 1

# Spoil rewards multiplier.
ChampionSpoilRewards = 1

# Spoil rewards multiplier if player premium.
PremiumChampionSpoilRewards = 1

# Atk bonus for champion (changes apply on patk & matk).
ChampionAtk = 1.

# MAtk bonus for champion.
ChampionMAtk = 1.

# Spd Atk bonus for champion.
ChampionSpdAtk = 1.

# Spd MAtk bonus for champion.
ChampionSpdMAtk = 1.

# Chance to obtain a specified reward item from a higher lvl champion (in percents) default is off using glittering medal as reward.
ChampionRewardItem = 0

# Specified reward item ID.
ChampionRewardItemID = 6393

# Specified reward item rnd qty.
ChampionRewardItemQty = 1

# Enable aura for monster champions.
# 0 - no aura / 1 - blue aura / 2 - red aura.
ChampionAura = 0

# ============================================================
#                       Class Master
# ============================================================

AllowEntireTree = False
AlternateClassMaster = False
ConfigClassMaster = 1;[57(100000)];[];2;[57(1000000)];[];3;[57(10000000)]];[6622(1)]

# The cost of purchasing Noblesse in ClassMaster.
NobleItemId = 4037
NobleItemCount = 50

# ============================================================
#                     Wedding System
# ============================================================

# Cost of wedding, price in Adena.
WeddingPrice = 1000000

# Homosexual marriages allowed, False by default.
WeddingAllowSameSex = False

# Do players require to wear formal wear ? True by default.
WeddingFormalWear = True

# ============================================================
#                          Buffer
# ============================================================

# Maximum number of available schemes per player.
BufferMaxSchemesPerChar = 6

# Static cost of buffs ; override skills price if different of -1.
