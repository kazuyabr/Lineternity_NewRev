# =================================================================
#                             Geodata
# =================================================================

GeoDataPath = ./data/geodata/
GeoDataType = L2OFF
NpcZindex = 32

# =================================================================
#                             Movement
# =================================================================

MaxGeopathFailCount = 30

# =================================================================
#                           Line of Sight
# =================================================================

PartOfCharacterHeight = 75
MaxObstacleHeight = 32

# =================================================================
#                           Pathfinding
# =================================================================

MoveWeight = 10
MoveWeightDiag = 14
ObstacleWeight = 30

EnableBoundaryCellPenalty = True
BoundaryCellPenalty = 25
BoundaryBuffer = 20

HeuristicWeight = 12
MaxIterations = 10000

# =================================================================
#                    Optimized Movement System
# =================================================================

SistemaPathfinding = True
UseOptimizedMovement = True
EnableClientSidePrediction = True
MovementValidationInterval = 500
MovementReconciliationThreshold = 32.0
PathfindingMaxNodes = 1500
PathfindingMaxIterations = 2000
EnablePathSmoothing = True
GeoEngineCacheSize = 50000
EnablePathfindingCache = {{EnablePathfindingCache}}
PathfindingCacheSize = 50000
PathfindingCacheExpiration = 30
PathfindingThreads = -1
UsePathfindingPool = True
UseL2BRPathfinding = True

# =================================================================
#                    Smooth Obstacle Avoidance
# =================================================================

EnableSmoothObstacleAvoidance = True
ObstacleSmoothingDistance = 55
ObstacleDetectionDistance = 32
PathfindingSmoothingLevel = 7
EnableRealTimeObstacleAvoidance = True

# ----------------------------------------------------------------
# Height Tolerance for Line of Sight
# ----------------------------------------------------------------

GeoHeightTolerance = 250

# ----------------------------------------------------------------
# Short Distance Threshold
# ----------------------------------------------------------------

ShortDistanceThreshold = 200
MaxShortDistanceHeightDiff = 424
MaxConsecutiveBlocks = 1

# =================================================================
#                   NPC Movement Optimization
# =================================================================

EnableNpcMovementOptimization = True
NpcMovementPlayerRange = 2000

# =================================================================
#                    Realistic Movement (Anti-Slide)
# =================================================================

EnableRealisticMovement = False
MovementStepSize = 14
MovementUpdateInterval = 75
EnableStepInterpolation = False
MovementAccelerationFactor = 0.2
EnableTerrainHeightCorrection = False
TerrainHeightTolerance = 32

# =================================================================
#                    Pathfinding for Attacks and Skills
# =================================================================

AttackUsePathfinder = True

# =================================================================
#                    Creature Collision System
# =================================================================

EnableCreatureCollision = False
CreatureCollisionCheckRadius = 150
CreatureCollisionAvoidanceRadius = 80
MaxAlternativePositions = 8
CreatureCollisionPushForce = 0.3

# =================================================================
#                    Pathfinder Cache System
# =================================================================

EnablePathfinderCache = False
PathfinderCacheSize = 10000
PathfinderCacheDirectory = ./data/pathfinder_cache/
CompressCacheFiles = False
PathfinderGenerationThreads = 4
CacheCleanupIntervalDays = 30
EnableAutoPreCalculation = False
MaxPreCalculationDistance = 2000
AutoSaveInterval = 300000
